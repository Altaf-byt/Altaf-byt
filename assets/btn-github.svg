<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 66" width="260" height="66" role="img" aria-label="GitHub: Altaf-byt">
<defs>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="blur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="bb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2230"/><stop offset="1" stop-color="#0d1117"/></linearGradient><clipPath id="bc"><rect x="2" y="2" width="256" height="62" rx="17"/></clipPath>
</defs>
<style>
.t{font-family:'Times New Roman', Times, 'Liberation Serif', serif;}

</style>
<rect x="2" y="2" width="256" height="62" rx="17" fill="url(#bb)"/><g clip-path="url(#bc)"><rect y="-10" width="34" height="90" fill="#fff" opacity="0.2" transform="skewX(-20)"><animate attributeName="x" values="-90;300;300" keyTimes="0;0.5;1" dur="3.6s" repeatCount="indefinite"/></rect></g><rect x="2" y="2" width="256" height="62" rx="17" fill="none" stroke="#8b949e" stroke-opacity="0.35" stroke-width="1.6"/><rect x="2" y="2" width="256" height="62" rx="17" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="16 84" filter="url(#soft)"><animate attributeName="stroke-dashoffset" from="0" to="-100" dur="3.2s" repeatCount="indefinite"/></rect><circle cx="38" cy="33" r="19" fill="#000" fill-opacity="0.25"/><circle cx="38" cy="33" r="19" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="1.6"><animate attributeName="r" values="19;24;19" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.8;0.1;0.8" dur="2.4s" repeatCount="indefinite"/></circle><text class="t" x="38" y="39" font-size="19" font-weight="bold" text-anchor="middle" fill="#fff">GH</text><text class="t" x="70" y="28" font-size="14" letter-spacing="3" fill="#fff" fill-opacity="0.78">GITHUB</text><text class="t" x="70" y="50" font-size="24" font-weight="bold" fill="#fff">Altaf-byt</text>
</svg>
