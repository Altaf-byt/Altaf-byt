<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52" role="img" aria-label="Instagram: altaf_azimi">
  <defs>
    <clipPath id="c"><rect x="1" y="1" width="218" height="50" rx="13"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4405f"/>
      <stop offset="0.55" stop-color="#b13a8f"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="218" height="50" rx="13" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <rect y="-10" width="36" height="80" fill="#ffffff" opacity="0.2" transform="skewX(-20)">
      <animate attributeName="x" values="-80;260" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="218" height="50" rx="13" fill="none" stroke="#ffb3c1" stroke-width="1.6">
    <animate attributeName="stroke" values="#ffb3c1;#ffffff;#ffb3c1" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="28" cy="26" r="6" fill="#ffffff">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <text x="46" y="22" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="9" letter-spacing="2" fill="#ffe3ea">INSTAGRAM</text>
  <text x="46" y="40" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="15" font-weight="bold" fill="#ffffff">altaf_azimi</text>
</svg>
