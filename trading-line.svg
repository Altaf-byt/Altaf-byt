<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Animated trading chart trending upward">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0a1a14"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e676" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="280">
        <animate attributeName="width" from="0" to="900" dur="4s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .t { font-family: 'Fira Code', 'Courier New', monospace; }
    .grid { stroke: #1f2a37; stroke-width: 1; stroke-dasharray: 4 6; }
    .ticker { animation: blink 1.4s steps(2, start) infinite; }
    @keyframes blink { to { opacity: 0.25; } }
  </style>

  <rect width="900" height="280" rx="14" fill="url(#bg)" stroke="#1f2a37"/>

  <!-- grid -->
  <g class="grid">
    <line x1="30" y1="60" x2="870" y2="60"/>
    <line x1="30" y1="110" x2="870" y2="110"/>
    <line x1="30" y1="160" x2="870" y2="160"/>
    <line x1="30" y1="210" x2="870" y2="210"/>
    <line x1="30" y1="250" x2="870" y2="250"/>
  </g>

  <!-- header -->
  <text x="30" y="34" class="t" font-size="15" fill="#c9d1d9" font-weight="bold">ALTAF/CODE</text>
  <text x="140" y="34" class="t ticker" font-size="15" fill="#00e676">▲ +247.8%</text>
  <text x="870" y="34" class="t" font-size="12" fill="#6e7681" text-anchor="end">SKILLS · COMMITS · PROJECTS</text>

  <!-- candlesticks (revealed left to right with the line) -->
  <g clip-path="url(#reveal)" opacity="0.85">
    <g stroke-width="2">
      <line x1="70"  y1="175" x2="70"  y2="212" stroke="#00e676"/><rect x="64"  y="185" width="12" height="18" fill="#00e676"/>
      <line x1="130" y1="170" x2="130" y2="208" stroke="#ff5252"/><rect x="124" y="180" width="12" height="20" fill="#ff5252"/>
      <line x1="190" y1="152" x2="190" y2="190" stroke="#00e676"/><rect x="184" y="162" width="12" height="20" fill="#00e676"/>
      <line x1="250" y1="148" x2="250" y2="182" stroke="#ff5252"/><rect x="244" y="156" width="12" height="16" fill="#ff5252"/>
      <line x1="310" y1="118" x2="310" y2="158" stroke="#00e676"/><rect x="304" y="128" width="12" height="22" fill="#00e676"/>
      <line x1="370" y1="126" x2="370" y2="164" stroke="#ff5252"/><rect x="364" y="134" width="12" height="20" fill="#ff5252"/>
      <line x1="430" y1="80"  x2="430" y2="120" stroke="#00e676"/><rect x="424" y="90"  width="12" height="22" fill="#00e676"/>
      <line x1="490" y1="92"  x2="490" y2="130" stroke="#ff5252"/><rect x="484" y="100" width="12" height="20" fill="#ff5252"/>
      <line x1="550" y1="62"  x2="550" y2="100" stroke="#00e676"/><rect x="544" y="72"  width="12" height="20" fill="#00e676"/>
      <line x1="610" y1="68"  x2="610" y2="102" stroke="#ff5252"/><rect x="604" y="76"  width="12" height="16" fill="#ff5252"/>
      <line x1="670" y1="46"  x2="670" y2="84"  stroke="#00e676"/><rect x="664" y="56"  width="12" height="20" fill="#00e676"/>
      <line x1="730" y1="52"  x2="730" y2="90"  stroke="#ff5252"/><rect x="724" y="60"  width="12" height="20" fill="#ff5252"/>
      <line x1="790" y1="30"  x2="790" y2="68"  stroke="#00e676" opacity="0"/><rect x="784" y="40"  width="12" height="20" fill="#00e676" opacity="0"/>
      <line x1="850" y1="54"  x2="850" y2="52"  stroke="#00e676" opacity="0"/>
    </g>
  </g>

  <!-- area + line -->
  <g clip-path="url(#reveal)">
    <path d="M40,200 L100,185 L150,195 L210,160 L260,170 L320,130 L370,145 L430,100 L480,115 L540,80 L590,95 L650,60 L710,75 L770,45 L820,55 L860,30 L860,250 L40,250 Z" fill="url(#area)"/>
    <path d="M40,200 L100,185 L150,195 L210,160 L260,170 L320,130 L370,145 L430,100 L480,115 L540,80 L590,95 L650,60 L710,75 L770,45 L820,55 L860,30"
          fill="none" stroke="#00e676" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- live price dot -->
  <g>
    <circle cx="860" cy="30" r="6" fill="#00e676" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.3s" fill="freeze"/>
    </circle>
    <circle cx="860" cy="30" r="6" fill="none" stroke="#00e676" stroke-width="2" opacity="0">
      <animate attributeName="r" values="6;22" dur="1.6s" begin="4.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.6s" begin="4.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- footer labels -->
  <text x="30" y="270" class="t" font-size="11" fill="#6e7681">Learning → Building → Shipping</text>
  <text x="870" y="270" class="t" font-size="11" fill="#00e676" text-anchor="end">keep coding, keep growing 🚀</text>
</svg>
