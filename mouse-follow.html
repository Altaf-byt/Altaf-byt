<div class="hint">MOVE YOUR MOUSE</div>
<script>
const pl=document.getElementById('pl'),pr=document.getElementById('pr'),s=document.getElementById('s');
function look(x,y){
  const r=s.getBoundingClientRect(),k=r.width/500;
  const cx=r.left+250*k,cy=r.top+156*k;
  let vx=x-cx,vy=y-cy,d=Math.hypot(vx,vy)||1,f=Math.min(1,d/250);
  const ox=vx/d*13*f,oy=vy/d*6.5*f;
  pl.setAttribute('transform','translate('+ox+' '+oy+')');pr.setAttribute('transform','translate('+ox+' '+oy+')');
}
addEventListener('mousemove',e=>look(e.clientX,e.clientY));
addEventListener('touchmove',e=>look(e.touches[0].clientX,e.touches[0].clientY));

const c=document.getElementById('c'),g=c.getContext('2d');let cols,drops;
function rs(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/16);drops=Array(cols).fill(0).map(()=>Math.random()*-50)}
rs();addEventListener('resize',rs);
setInterval(()=>{g.fillStyle='rgba(1,6,3,.12)';g.fillRect(0,0,c.width,c.height);g.fillStyle='#00ff41';g.font='15px serif';
