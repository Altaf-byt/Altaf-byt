<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="img" aria-label="Animated divider line">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b0ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00b0ff"/>
      <stop offset="0.5" stop-color="#b388ff"/>
      <stop offset="0.75" stop-color="#00e676"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="20" y="11" width="860" height="2" rx="1" fill="url(#line)" opacity="0.75"/>
  <!-- travelling spark -->
  <circle cy="12" r="4" fill="#ffffff" filter="url(#gl)">
    <animate attributeName="cx" values="20;880;20" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="12" r="2.5" fill="#00b0ff" filter="url(#gl)">
    <animate attributeName="cx" values="20;880;20" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" dur="5s" begin="0.15s" repeatCount="indefinite"/>
  </circle>
  <!-- centre diamond -->
  <path d="M450,4 L458,12 L450,20 L442,12 Z" fill="#b388ff" filter="url(#gl)">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
